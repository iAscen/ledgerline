version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - nolintlint
    - revive
    - unconvert
    - usestdlibvars
  settings:
    revive:
      rules:
        - name: exported
          arguments: [disableStutteringCheck]
    gosec:
      excludes:
        - G117 # field names like "Secret" are config, not hardcoded credentials
  exclusions:
    generated: lax
    presets: [comments, std-error-handling]
    rules:
      - path: _test\.go
        linters: [gosec, noctx, bodyclose, contextcheck]
      - path: internal/store/pgdb/
        linters: [revive]

formatters:
  enable: [gofmt, goimports]
  settings:
    goimports:
      local-prefixes: [github.com/iAscen/ledgerline]

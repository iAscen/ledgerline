# Local development stack: API + worker (one binary), Postgres, and Jaeger for
# traces. Secrets here are throwaway development values, never real ones.
#   docker compose up --build
#   open http://localhost:16686 for traces, http://localhost:9090/metrics for metrics
name: ledgerline

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ledgerline
      POSTGRES_USER: ledgerline
      POSTGRES_PASSWORD: ledgerline
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerline -d ledgerline"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes: [pgdata:/var/lib/postgresql/data]

  jaeger:
    image: jaegertracing/jaeger:2.10.0
    ports:
      - "16686:16686" # UI
      - "4318:4318"   # OTLP/HTTP

  api:
    build:
      context: .
      args: { VERSION: compose }
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      - "8080:8080" # public API
      - "9090:9090" # metrics (internal)
    environment:
      LEDGERLINE_STORE: postgres
      LEDGERLINE_DATABASE_URL: postgres://ledgerline:ledgerline@postgres:5432/ledgerline?sslmode=disable
      LEDGERLINE_JWT_SECRET: dev-only-jwt-secret-change-me-0123456789
      LEDGERLINE_WEBHOOK_SECRET: dev-only-webhook-secret
      LEDGERLINE_WEBHOOK_ALLOW_PRIVATE: "true"
      LEDGERLINE_PROVIDER: ${LEDGERLINE_PROVIDER:-fake}
      LEDGERLINE_ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LEDGERLINE_BREAKER_THRESHOLD: "3"
      LEDGERLINE_BREAKER_OPEN_TIMEOUT: 20s
      LEDGERLINE_CORS_ORIGINS: http://localhost:3000
      LEDGERLINE_PUBLIC_DEMO: "true"
      LEDGERLINE_LOG_FORMAT: text
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    healthcheck:
      test: ["CMD", "/usr/local/bin/ledgerline", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
